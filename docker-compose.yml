version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satria-eko-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=koperasi
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - db
    networks:
      - satria-network

  db:
    image: mysql:5.7
    container_name: satria-eko-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=koperasi
      - MYSQL_ROOT_PASSWORD=secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - satria-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: satria-eko-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    depends_on:
      - db
    networks:
      - satria-network

volumes:
  db_data:

networks:
  satria-network:
    driver: bridge