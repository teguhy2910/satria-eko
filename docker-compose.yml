
services:
  app:
    image: satria-eko:latest
    container_name: satria-eko-app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_CHANNEL=stderr
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-SATRIA}
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - SESSION_DRIVER=file
    depends_on:
      - db
    networks:
      - satria-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: mysql:8.0
    container_name: satria-eko-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-SATRIA}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"
    networks:
      - satria-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-secret}"]
      timeout: 20s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: satria-eko-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_ARBITRARY=1
    depends_on:
      - db
    networks:
      - satria-network

volumes:
  db_data:

networks:
  satria-network:
    driver: bridge