
services:
  app:
    image: satria-eko:dev
    container_name: satria-eko-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-SATRIA}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - LOG_CHANNEL=${LOG_CHANNEL:-stack}
    depends_on:
      - db
    networks:
      - satria-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: mysql:8.0
    container_name: satria-eko-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-SATRIA}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - satria-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: satria-eko-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    depends_on:
      - db
    networks:
      - satria-network

volumes:
  db_data:

networks:
  satria-network:
    driver: bridge